[project]
name = "robot-agent"
version = "0.1.0"
description = "A self-evolving robotic agent system on the SO-101 arm."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
sim = ["mujoco>=3.3"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
