<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1228 744" width="1228" height="744" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
  <title>System overview</title>
  <desc>Left: the improvement loop. Between deployments, System 3 (a frontier LLM) reads logs and improves data, model, environment and harness; every change passes a gate on change before it is deployed. Right: the runtime loop. Inside the harness, System 2 orchestrates System 1 executors (code skills and a VLA); their actions go through one action queue to System 0 and the SO-101 arm. Events flow up to System 2, and logs flow back to System 3.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#6B6A65" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1228" height="744" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="48" y="56" font-size="26" font-weight="700" fill="#1F1F1D">System overview</text>
  <text x="48" y="82" font-size="14" fill="#6B6A65">A large model improves every part of the system between deployments; a small model runs it during a task.</text>

  <!-- ===== Improvement loop panel ===== -->
  <rect x="48" y="112" width="480" height="572" rx="16" fill="#FAFAF7" stroke="#E3E1DA"/>
  <text x="76" y="148" font-size="17" font-weight="700" fill="#2C2C2A">Improvement loop</text>
  <text x="76" y="170" font-size="13" fill="#6B6A65">Between deployments</text>

  <rect x="76" y="190" width="424" height="76" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="288" y="222" font-size="16" font-weight="700" fill="#3C3489" text-anchor="middle">System 3 · frontier LLM</text>
  <text x="288" y="246" font-size="13" fill="#534AB7" text-anchor="middle">Works offline: reads logs, proposes improvements</text>

  <line x1="288" y1="266" x2="288" y2="292" stroke="#6B6A65" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="76" y="298" width="204" height="68" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="178" y="326" font-size="15" font-weight="700" fill="#085041" text-anchor="middle">Data</text>
  <text x="178" y="348" font-size="12.5" fill="#0F6E56" text-anchor="middle">Collect, label, curate</text>

  <rect x="296" y="298" width="204" height="68" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="398" y="326" font-size="15" font-weight="700" fill="#085041" text-anchor="middle">Model</text>
  <text x="398" y="348" font-size="12.5" fill="#0F6E56" text-anchor="middle">Train VLA and System 2</text>

  <rect x="76" y="382" width="204" height="68" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="178" y="410" font-size="15" font-weight="700" fill="#085041" text-anchor="middle">Environment</text>
  <text x="178" y="432" font-size="12.5" fill="#0F6E56" text-anchor="middle">Sim tasks and tests</text>

  <rect x="296" y="382" width="204" height="68" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="398" y="410" font-size="15" font-weight="700" fill="#085041" text-anchor="middle">Harness</text>
  <text x="398" y="432" font-size="12.5" fill="#0F6E56" text-anchor="middle">Skills, memory, rules</text>

  <line x1="288" y1="450" x2="288" y2="476" stroke="#6B6A65" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="76" y="482" width="424" height="68" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/>
  <text x="288" y="510" font-size="15" font-weight="700" fill="#633806" text-anchor="middle">Gate on change</text>
  <text x="288" y="532" font-size="12.5" fill="#854F0B" text-anchor="middle">Held-out tests · adopt a change only if it is better</text>

  <text x="288" y="600" font-size="12.5" fill="#6B6A65" text-anchor="middle">Every improved part returns to the runtime loop.</text>
  <text x="288" y="620" font-size="12.5" fill="#6B6A65" text-anchor="middle">Progress: System 3 is needed less often over time.</text>

  <!-- deploy -->
  <line x1="500" y1="516" x2="564" y2="516" stroke="#6B6A65" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="532" y="506" font-size="12" font-weight="600" fill="#6B6A65" text-anchor="middle">deploy</text>

  <!-- ===== Runtime loop panel ===== -->
  <rect x="568" y="112" width="612" height="572" rx="16" fill="#FAFAF7" stroke="#E3E1DA"/>
  <text x="596" y="148" font-size="17" font-weight="700" fill="#2C2C2A">Runtime loop</text>
  <text x="596" y="170" font-size="13" fill="#6B6A65">During a task</text>

  <!-- Harness container -->
  <rect x="596" y="190" width="528" height="240" rx="12" fill="#FFFFFF" stroke="#A9A79E" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="616" y="218" font-size="14" font-weight="700" fill="#444441">Harness</text>
  <g font-size="12" fill="#444441" text-anchor="middle">
    <rect x="684" y="203" width="70" height="22" rx="11" fill="#F1EFE8" stroke="#D3D1C7"/>
    <text x="719" y="218">monitor</text>
    <rect x="762" y="203" width="76" height="22" rx="11" fill="#F1EFE8" stroke="#D3D1C7"/>
    <text x="800" y="218">recovery</text>
    <rect x="846" y="203" width="70" height="22" rx="11" fill="#F1EFE8" stroke="#D3D1C7"/>
    <text x="881" y="218">memory</text>
    <rect x="924" y="203" width="100" height="22" rx="11" fill="#F1EFE8" stroke="#D3D1C7"/>
    <text x="974" y="218">safety check</text>
    <rect x="1032" y="203" width="76" height="22" rx="11" fill="#F1EFE8" stroke="#D3D1C7"/>
    <text x="1070" y="218">recorder</text>
  </g>

  <rect x="616" y="246" width="488" height="68" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="860" y="274" font-size="16" font-weight="700" fill="#3C3489" text-anchor="middle">System 2 · orchestrator</text>
  <text x="860" y="297" font-size="13" fill="#534AB7" text-anchor="middle">Small trained model, or large model with skills</text>

  <line x1="860" y1="314" x2="860" y2="334" stroke="#6B6A65" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="616" y="340" width="488" height="68" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="860" y="368" font-size="16" font-weight="700" fill="#3C3489" text-anchor="middle">System 1 · executors</text>
  <text x="860" y="391" font-size="13" fill="#534AB7" text-anchor="middle">Code skills, plus a VLA for contact-rich steps</text>

  <line x1="860" y1="408" x2="860" y2="452" stroke="#6B6A65" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="616" y="458" width="488" height="48" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
  <text x="860" y="487" font-size="14" fill="#444441" text-anchor="middle">One action queue · one rate · every step tagged</text>

  <line x1="860" y1="506" x2="860" y2="524" stroke="#6B6A65" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="616" y="530" width="488" height="66" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
  <text x="860" y="557" font-size="16" font-weight="700" fill="#444441" text-anchor="middle">System 0 · body layer</text>
  <text x="860" y="580" font-size="13" fill="#5F5E5A" text-anchor="middle">SO-101 servo loop, limits, contact events</text>

  <line x1="860" y1="596" x2="860" y2="614" stroke="#6B6A65" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="616" y="620" width="488" height="44" rx="10" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/>
  <text x="860" y="647" font-size="14" fill="#444441" text-anchor="middle">SO-101 arm · MuJoCo or real</text>

  <!-- events: System 0 up to System 2 -->
  <path d="M1104 563 L1140 563 L1140 280 L1110 280" fill="none" stroke="#6B6A65" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="1112" y="474" width="56" height="22" rx="11" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text x="1140" y="489" font-size="12" font-weight="600" fill="#6B6A65" text-anchor="middle">events</text>

  <!-- logs: runtime back to System 3 -->
  <path d="M860 664 L860 708 L26 708 L26 228 L70 228" fill="none" stroke="#6B6A65" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="356" y="697" width="244" height="22" rx="11" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text x="478" y="712" font-size="12" font-weight="600" fill="#6B6A65" text-anchor="middle">logs · traces, failures, recoveries</text>
</svg>
